    <script>
      // Before React loads: apply the saved theme (default dark) and reserve
      // space for the announcement bar, so nothing flashes or shifts.
      (function () {
        var root = document.documentElement, theme = "dark", bar = true;
        try {
          theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
          bar = localStorage.getItem("announcement-dismissed:pathwise-v1") !== "1";
        } catch (e) {}
        root.classList.toggle("dark", theme === "dark");
        root.style.colorScheme = theme;
        if (bar) root.classList.add("has-announcement");
      })();
    </script>
